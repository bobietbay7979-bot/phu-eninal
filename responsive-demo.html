<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Evidence — Discover Phu Yen</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef2f0; color: #17343b; font-family: Arial, Helvetica, sans-serif; }
    header { padding: 2.5rem 1rem 1.5rem; text-align: center; }
    h1 { margin: 0 0 0.5rem; font-size: clamp(2rem, 5vw, 3.5rem); }
    header p { margin: 0; color: #536b70; }
    main { width: min(100% - 2rem, 74rem); margin: auto; padding-bottom: 3rem; }
    section { margin-bottom: 2.5rem; }
    h2 { margin-bottom: 0.75rem; font-size: 1.3rem; }
    .frame { overflow: hidden; border: 10px solid #17343b; border-radius: 22px; background: #fff; box-shadow: 0 18px 45px rgba(17, 49, 56, 0.18); }
    .desktop-frame { width: 100%; height: 760px; }
    .mobile-frame { width: 390px; max-width: 100%; height: 844px; margin-inline: auto; border-radius: 36px; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    .note { max-width: 46rem; margin: 1rem auto 0; color: #536b70; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Responsive layout evidence</h1>
    <p>The same page is displayed inside two different viewport widths.</p>
  </header>
  <main>
    <section aria-labelledby="large-title">
      <h2 id="large-title">Large-screen view</h2>
      <div class="frame desktop-frame">
        <iframe src="index.html" title="Discover Phu Yen large-screen demonstration"></iframe>
      </div>
    </section>
    <section aria-labelledby="mobile-title">
      <h2 id="mobile-title">Mobile view — 390 pixels</h2>
      <div class="frame mobile-frame">
        <iframe src="index.html" title="Discover Phu Yen mobile demonstration"></iframe>
      </div>
      <p class="note">The mobile view uses a collapsed menu and a single-column layout. The large-screen view uses horizontal navigation and a three-column destination grid.</p>
    </section>
  </main>
</body>
</html>
